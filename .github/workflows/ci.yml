name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run Python examples (skip input)
        run: |
          for f in python/*.py; do
            case "$f" in
              *input*|*error_handling*) echo "skip $f" ;;
              *) python "$f" || true ;;
            esac
          done

      - name: Run JavaScript examples (skip input)
        run: |
          for f in javascript/*.js; do
            case "$f" in
              *input*) echo "skip $f" ;;
              *) node "$f" || true ;;
            esac
          done

      - name: Run Go examples (skip input)
        run: |
          for f in go/*.go; do
            case "$f" in
              *input*) echo "skip $f" ;;
              *) go run "$f" || true ;;
            esac
          done

      - name: Run Rust examples (skip input)
        run: |
          for f in rust/*.rs; do
            case "$f" in
              *input*) echo "skip $f" ;;
              *) rustc "$f" -o /tmp/out && /tmp/out || true ;;
            esac
          done

      - name: Run PHP examples
        run: |
          for f in php/*.php; do
            case "$f" in
              *input*) echo "skip $f" ;;
              *) php "$f" || true ;;
            esac
          done

      - name: Run Ruby examples
        run: |
          for f in ruby/*.rb; do
            case "$f" in
              *input*) echo "skip $f" ;;
              *) ruby "$f" || true ;;
            esac
          done
