name: Smoke

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Smoke test: compile/run non-interactive lessons. Not golden-output tests.
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: dtolnay/rust-toolchain@stable

      - name: Install PHP Ruby g++ mono TypeScript
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli ruby g++ mono-mcs mono-runtime
          npm install -g typescript

      # Skip: stdin lessons + network-dependent HTTP demos
      - name: Python smoke
        run: |
          set -e
          for f in python/*.py; do
            case "$f" in
              python/10_input.py|python/17_http.py) echo "skip $f"; continue ;;
            esac
            echo "RUN $f"
            python "$f"
          done

      - name: JavaScript smoke
        run: |
          set -e
          for f in javascript/*.js; do
            case "$f" in
              javascript/10_input.js|javascript/17_http.js) echo "skip $f"; continue ;;
            esac
            echo "RUN $f"
            node "$f"
          done

      - name: Go smoke
        run: |
          set -e
          for f in go/*.go; do
            case "$f" in
              go/10_input.go|go/17_http.go) echo "skip $f"; continue ;;
            esac
            echo "RUN $f"
            go run "$f"
          done

      - name: Rust smoke
        run: |
          set -e
          for f in rust/*.rs; do
            case "$f" in
              rust/10_input.rs) echo "skip $f"; continue ;;
            esac
            echo "RUN $f"
            rustc "$f" -o /tmp/out && /tmp/out
          done

      - name: PHP smoke
        run: |
          set -e
          for f in php/*.php; do
            case "$f" in
              php/10_input.php) echo "skip $f"; continue ;;
            esac
            echo "RUN $f"
            php "$f"
          done

      - name: Ruby smoke
        run: |
          set -e
          for f in ruby/*.rb; do
            case "$f" in
              ruby/10_input.rb) echo "skip $f"; continue ;;
            esac
            echo "RUN $f"
            ruby "$f"
          done

      - name: Java smoke
        run: |
          set -e
          for f in java/*.java; do
            case "$f" in
              *input*|*/10_*) echo "skip $f"; continue ;;
            esac
            echo "RUN $f"
            # public class must match filename — copy to temp with correct name
            classname=$(grep -E 'public[[:space:]]+class[[:space:]]+[A-Za-z0-9_]+' "$f" | head -1 | sed -E 's/.*class[[:space:]]+([A-Za-z0-9_]+).*/\1/')
            if [ -z "$classname" ]; then
              classname=$(grep -E 'class[[:space:]]+[A-Za-z0-9_]+' "$f" | head -1 | sed -E 's/.*class[[:space:]]+([A-Za-z0-9_]+).*/\1/')
            fi
            cp "$f" "/tmp/${classname}.java"
            javac "/tmp/${classname}.java" -d /tmp
            java -cp /tmp "$classname"
          done

      - name: C++ smoke
        run: |
          set -e
          for f in cpp/*.cpp; do
            case "$f" in
              *input*|*/10_*) echo "skip $f"; continue ;;
            esac
            echo "RUN $f"
            g++ "$f" -o /tmp/cpp_out && /tmp/cpp_out
          done

      - name: C# smoke (mono)
        run: |
          set -e
          for f in csharp/*.cs; do
            case "$f" in
              *input*|*/10_*) echo "skip $f"; continue ;;
            esac
            echo "RUN $f"
            mcs "$f" -out:/tmp/cs.exe && mono /tmp/cs.exe
          done

      - name: TypeScript typecheck
        run: |
          set -e
          command -v tsc
          for f in typescript/*.ts; do
            case "$f" in
              *input*|*/10_*) echo "skip $f"; continue ;;
            esac
            echo "CHECK $f"
            tsc --noEmit --esModuleInterop --module commonjs --target ES2020 "$f"
          done
